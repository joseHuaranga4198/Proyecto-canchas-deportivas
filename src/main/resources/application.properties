spring.application.name=demo
server.port=8086

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.format.date=iso
spring.mvc.format.time=iso
spring.web.resources.static-locations=classpath:/static/,classpath:/webapp/

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:datos-iniciales.sql
spring.sql.init.encoding=UTF-8

spring.datasource.url=jdbc:h2:file:./data/canchas;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

server.servlet.session.timeout=20m
spring.jackson.time-zone=America/Lima
